[project]
name = "ai-job-tracker"
version = "0.1.0"
description = "Automated job scraper, AI analyzer, and Telegram notifier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "linkedin-scraper>=3.0.0",
    "playwright>=1.52.0",
    "python-dotenv>=1.1.0",
    "python-jobspy>=1.1.82",
    "python-telegram-bot>=22.0",
]

[project.scripts]
job-scrape = "ai_job_tracker.scraper:main"
job-analyze = "ai_job_tracker.analyzer:run"
job-daily = "ai_job_tracker.run_daily:main"
job-career = "ai_job_tracker.career_scraper:main"
job-proxies = "ai_job_tracker.proxy_scraper:main"
job-validate-proxies = "ai_job_tracker.validate_proxies:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
