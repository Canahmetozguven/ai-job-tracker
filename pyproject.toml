[project]
name = "ai-job-tracker"
version = "0.1.0"
description = "Automated job scraper, AI analyzer, and Telegram notifier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "linkedin-scraper>=3.0.0",
    "playwright>=1.52.0",
    "python-dotenv>=1.1.0",
    "python-jobspy>=1.1.82",
    "python-telegram-bot>=22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
