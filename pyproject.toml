[project]
name = "ai-job-tracker"
version = "0.1.0"
description = "Automated job scraper, AI analyzer, and Telegram notifier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "linkedin-scraper>=3.0.0",
    "playwright>=1.52.0",
    "pydantic-settings>=2.15.0",
    "python-jobspy>=1.1.82",
    "python-telegram-bot>=22.0",
    "typer>=0.27.2",
]

[project.scripts]
job = "ai_job_tracker.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
