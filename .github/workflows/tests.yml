name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.12.5"
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Smoke-check CLI entry points
        run: |
          uv run job --help
          for cmd in scrape analyze daily career proxies validate-proxies; do
            uv run job "$cmd" --help
          done
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run tests
        run: uv run pytest
